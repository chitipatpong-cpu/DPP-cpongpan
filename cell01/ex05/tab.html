<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
</head>
<body>
    <table style="width: 100%; height: 100px; border: 1px solid black; border-collapse: collapse;">
        <tr>
            <td style="background-color: #d34d4d;">First Cell</td>
            <td style="background-color: #59de4d;">Second Cell</td>
        </tr>
    </table>
</body>
</html>
