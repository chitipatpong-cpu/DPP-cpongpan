<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        table {
            width: 100vw;
            height: 100vh;
            border: 1px solid black;
            border-collapse: collapse;
        }
        tr {
            height: 100%;
        }
        td {
            width: 50%;
            height: 100%;
        }
        .First {
            background-color: #d34d4d;
        }
        .Second {
            background-color: #59de4d;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="First">First Cell</td>
            <td class="Second">Second Cell</td>
        </tr>
    </table>
</body>
</html>
